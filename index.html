<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="A private, offline app to remember where you keep your things." />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)" />
  <title>Where Did I Keep It?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ==================== MAIN SCREEN ==================== -->
    <section id="main-screen" class="screen" aria-label="Saved items">
      <header class="app-header">
        <h1 class="app-title">Where Did I Keep It?</h1>
        <p class="app-subtitle">Your personal memory for physical things.</p>
      </header>

      <div class="controls">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input
            id="search-input"
            class="input search-input"
            type="search"
            placeholder="Search items, locations, notes…"
            aria-label="Search items"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="select-wrap">
          <select id="category-filter" class="input category-filter" aria-label="Filter by category">
            <option value="">All Categories</option>
          </select>
          <svg class="select-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <button id="add-item-btn" class="btn btn-primary add-btn" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
          <span>Add Item</span>
        </button>
      </div>

      <p id="status-message" class="status-message hidden" role="status" aria-live="polite"></p>

      <div id="items-container" class="items-grid"></div>

      <div id="empty-state" class="empty-state hidden" role="status">
        <div class="empty-state-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.3 7 12 12 20.7 7"/>
            <line x1="12" y1="22" x2="12" y2="12"/>
          </svg>
        </div>
        <h2 id="empty-state-text" class="empty-state-title">No items yet</h2>
        <p id="empty-state-hint" class="empty-state-hint">
          Start saving where you keep the things you don't want to lose.
        </p>
        <button id="empty-state-add-btn" class="btn btn-primary empty-state-btn" type="button">
          Add your first item
        </button>
      </div>
    </section>

    <!-- ==================== ADD / EDIT SCREEN ==================== -->
    <section id="form-screen" class="screen hidden" aria-label="Item form">
      <header class="app-header form-header">
        <button id="back-btn" class="btn btn-ghost icon-btn" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <polyline points="15 18 9 12 15 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Back</span>
        </button>
        <h2 id="form-title" class="form-title">Add Item</h2>
      </header>

      <form id="item-form" class="item-form" novalidate>

        <section class="form-block" aria-labelledby="form-block-details">
          <h3 id="form-block-details" class="form-block-title">Details</h3>

          <div class="field field-primary">
            <label for="item-name">Item name <span class="required" aria-hidden="true">*</span></label>
            <input
              id="item-name"
              class="input input-lg"
              type="text"
              maxlength="200"
              autocomplete="off"
              placeholder="Blue screwdriver"
              required
            />
          </div>

          <div class="field">
            <label for="item-location">Location</label>
            <input
              id="item-location"
              class="input"
              type="text"
              maxlength="300"
              autocomplete="off"
              placeholder="Store Room > Left Cabinet > Top Shelf"
            />
            <p class="field-hint">Use &gt; to build a path: Room &gt; Cabinet &gt; Shelf.</p>
          </div>

          <div class="field">
            <label for="item-category">Category</label>
            <input
              id="item-category"
              class="input"
              type="text"
              maxlength="100"
              autocomplete="off"
              placeholder="Tools"
              list="category-list"
            />
            <datalist id="category-list"></datalist>
          </div>

          <div class="field">
            <label for="item-notes">Notes</label>
            <textarea
              id="item-notes"
              class="input textarea"
              rows="3"
              maxlength="2000"
              placeholder="Small blue handle"
            ></textarea>
          </div>
        </section>

        <section class="form-block" aria-labelledby="form-block-photo">
          <h3 id="form-block-photo" class="form-block-title">Photo</h3>

          <div class="photo-area">
            <div class="photo-frame">
              <img id="photo-preview" class="photo-preview hidden" alt="Selected item photo" />
              <div id="photo-placeholder" class="photo-placeholder">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="16" rx="3"/>
                  <circle cx="9" cy="10" r="1.8"/>
                  <path d="M21 16l-5-5-9 8"/>
                </svg>
                <span>No photo</span>
              </div>
            </div>

            <div class="photo-actions">
              <button id="pick-photo-btn" class="btn btn-secondary" type="button">Choose photo</button>
              <input id="item-photo" class="file-input" type="file" accept="image/*" />
              <button id="remove-photo-btn" class="btn btn-ghost danger-ghost hidden" type="button">
                Remove photo
              </button>
              <p class="photo-note">Stored only on this device. Never uploaded.</p>
            </div>
          </div>
        </section>

        <p id="form-error" class="form-error hidden" role="alert"></p>

        <div class="form-actions">
          <button id="save-btn" class="btn btn-primary" type="submit">Save</button>
          <button id="cancel-btn" class="btn btn-secondary" type="button">Cancel</button>
          <button id="delete-btn" class="btn btn-danger hidden" type="button">Delete</button>
        </div>
      </form>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
